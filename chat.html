<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="chat.css">
  <title>Chatta con la pagina</title>
</head>
<body>
  <header>
    <h1>Chatta con la pagina</h1>
    <p id="context" class="context">Nessuna pagina catturata.</p>
  </header>
  <main id="messages" class="messages"></main>
  <footer>
    <textarea id="question" rows="2" placeholder="Fai una domanda sull'ultima pagina catturata…"></textarea>
    <button id="sendBtn">Invia</button>
  </footer>
  <script src="chat.js"></script>
</body>
</html>
